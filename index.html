  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Lot Draw App</title>
    <!-- Canvas Confetti Library for the celebration effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #111026 100%);
            /* NEW ATTRACTIVE CONTAINER COLOR: Deep Obsidian Indigo blend with high saturation blur */
            --panel-bg: rgba(20, 21, 43, 0.85);
            --border-color: rgba(99, 102, 241, 0.25);
            --accent-primary: #818cf8;
            --accent-success: #10b981;
            --accent-danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        .app-container {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px -5px rgba(99, 102, 241, 0.1);
            transition: transform 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #c084fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(10, 11, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }

        button {
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #add-btn {
            background: var(--accent-primary);
            color: #ffffff;
            padding: 0 24px;
        }

        #add-btn:hover {
            background: #6366f1;
            transform: translateY(-1px);
        }

        .pool-panel {
            background: rgba(10, 11, 23, 0.5);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            background: rgba(129, 140, 248, 0.15);
            color: var(--accent-primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        #items-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 1rem;
            padding-right: 4px;
        }

        /* Custom Scrollbar */
        #items-list::-webkit-scrollbar {
            width: 6px;
        }
        #items-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        #items-list li {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delete-btn {
            background: transparent;
            color: var(--text-muted);
            padding: 4px 8px;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        .delete-btn:hover {
            color: var(--accent-danger);
            background: rgba(244, 63, 94, 0.1);
        }

        .clear-btn {
            background: transparent;
            color: var(--accent-danger);
            font-size: 0.85rem;
            width: 100%;
            padding: 8px;
            border: 1px dashed rgba(244, 63, 94, 0.3);
        }

        .clear-btn:hover {
            background: rgba(244, 63, 94, 0.08);
        }

        .draw-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.3);
        }

        .draw-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(16, 185, 129, 0.4);
        }

        .draw-btn:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        #result-card {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(5, 96, 105, 0.12) 100%);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 16px;
            text-align: center;
            transform: scale(1);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.9);
        }

        #result-card h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-success);
            margin-bottom: 0.5rem;
        }

        #winner-display {
            font-size: 2.25rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
            word-break: break-word;
        }

        .shuffling {
            animation: fastPulse 0.12s infinite alternate;
            background: linear-gradient(to right, #f43f5e, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes fastPulse {
            from { transform: scale(0.95); filter: blur(1px); }
            to { transform: scale(1.05); filter: blur(0); }
        }

        /* Mobile Specific Optimizations */
        @media (max-width: 480px) {
            body {
                padding: 0.75rem;
            }
            
            .app-container {
                padding: 1.5rem 1.25rem;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.75rem;
            }

            input[type="text"] {
                padding: 14px;
            }

            button {
                padding: 14px;
            }
            
            #add-btn {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <!-- UPDATED ICON HERE -->
            <h1>👑 Grand Lot Draw</h1>
            <p class="subtitle">Fair, randomized selection in real-time</p>
        </header>

        <div class="input-group">
            <input type="text" id="item-input" placeholder="Add name or item..." autocomplete="off">
            <button id="add-btn">Add</button>
        </div>

        <div class="pool-panel">
            <div class="panel-header">
                <span>Pool Entries</span>
                <span class="badge" id="count">0 items</span>
            </div>
            <ul id="items-list"></ul>
            <button id="clear-btn" class="clear-btn">Clear Pool</button>
        </div>

        <button id="draw-btn" class="draw-btn">Draw Random Winner</button>

        <div id="result-card" class="hidden">
            <h2>🏆 Winner Selected 🏆</h2>
            <div id="winner-display"></div>
        </div>
    </div>

    <script>
        let items = [];

        const itemInput = document.getElementById('item-input');
        const addBtn = document.getElementById('add-btn');
        const itemsList = document.getElementById('items-list');
        const countSpan = document.getElementById('count');
        const clearBtn = document.getElementById('clear-btn');
        const drawBtn = document.getElementById('draw-btn');
        const resultCard = document.getElementById('result-card');
        const winnerDisplay = document.getElementById('winner-display');

        // Logic Functions
        function addItem() {
            const value = itemInput.value.trim();
            if (value === "") return;
            
            items.push(value);
            itemInput.value = "";
            itemInput.focus();
            
            updateUI();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            updateUI();
        }

        function clearAll() {
            items = [];
            resultCard.classList.add('hidden');
            updateUI();
        }

        function updateUI() {
            itemsList.innerHTML = "";
            
            items.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${item}</span>
                    <button class="delete-btn" onclick="deleteItem(${index})">✕</button>
                `;
                itemsList.appendChild(li);
            });
            
            countSpan.textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;
            itemsList.scrollTop = itemsList.scrollHeight;
        }

        function triggerConfetti() {
            const duration = 2 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#818cf8', '#10b981', '#f43f5e']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#818cf8', '#10b981', '#f43f5e']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function drawWinner() {
            if (items.length === 0) {
                alert("The pool is empty! Add items first.");
                return;
            }

            resultCard.classList.remove('hidden');
            winnerDisplay.classList.add('shuffling');
            drawBtn.disabled = true;

            let counter = 0;
            const totalCycles = 15; 

            const shuffleInterval = setInterval(() => {
                const temporaryRandomIndex = Math.floor(Math.random() * items.length);
                winnerDisplay.textContent = items[temporaryRandomIndex];
                counter++;

                if (counter > totalCycles) {
                    clearInterval(shuffleInterval);
                    
                    const finalIndex = Math.floor(Math.random() * items.length);
                    winnerDisplay.textContent = items[finalIndex];
                    
                    winnerDisplay.classList.remove('shuffling');
                    drawBtn.disabled = false;
                    
                    triggerConfetti();
                }
            }, 100);
        }

        // Action Triggers
        addBtn.addEventListener('click', addItem);
        clearBtn.addEventListener('click', clearAll);
        drawBtn.addEventListener('click', drawWinner);

        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });
    </script>
</body>
</html>
