  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lot Draw App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎟️ Lot Draw Simulator</h1>
        <p class="subtitle">Enter names or items to draw a random winner!</p>

        <div class="input-section">
            <input type="text" id="item-input" placeholder="Enter a name/item..." autocomplete="off">
            <button id="add-btn">Add</button>
        </div>

        <div class="list-section">
            <h3>Current Entries (<span id="count">0</span>)</h3>
            <ul id="items-list"></ul>
            <button id="clear-btn" class="secondary-btn">Clear All</button>
        </div>

        <div class="draw-section">
            <button id="draw-btn" class="primary-btn">Draw a Winner!</button>
        </div>

        <div id="result-container" class="hidden">
            <h2>🎉 Winner 🎉</h2>
            <div id="winner-display"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
